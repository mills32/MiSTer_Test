name: Build PCXT Core

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Build with Quartus
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/build \
          -w /build \
          raetro/quartus:17.0 \
          quartus_sh --flow compile PCXT.qpf
    
    - name: Check build output
      run: |
        if [ -f output_files/PCXT.rbf ]; then
          echo "Build successful!"
          ls -lh output_files/
        else
          echo "Build failed - RBF file not found"
          exit 1
        fi
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: PCXT-build-${{ github.sha }}
        path: |
          output_files/*.rbf
          output_files/*.sof
          output_files/*.rpt
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          output_files/*.rbf
          output_files/*.sof
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
