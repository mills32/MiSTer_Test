name: Build MiSTer Core

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/raetro/quartus:<version>
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build core with Quartus
        run: |
          quartus_sh --flow compile NES

      - name: Upload RBF artifact
        uses: actions/upload-artifact@v4
        with:
          name: NES_rbf
          path: output_files/*.rbf
